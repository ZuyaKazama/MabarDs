name: Build APK + Linux

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install NDK, CMake, platform
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Fetch melonDS + ENet
        run: ./scripts/fetch_deps.sh

      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: app/.cxx
          key: cxx-${{ hashFiles('scripts/fetch_deps.sh', 'patches/*.patch', 'app/src/main/cpp/*.cpp', 'app/src/main/cpp/*.h', 'app/src/main/cpp/gles/*', 'app/src/main/cpp/CMakeLists.txt') }}
          restore-keys: cxx-

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "EMUNDS_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "EMUNDS_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "EMUNDS_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          else
            # No secrets configured: throwaway key so the APK is installable.
            # Configure the KEYSTORE_* secrets to keep a stable signature between builds.
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" -alias emunds \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass emunds123 -keypass emunds123 \
              -dname "CN=EmuNDS"
            echo "EMUNDS_KEYSTORE_PASSWORD=emunds123" >> "$GITHUB_ENV"
            echo "EMUNDS_KEY_ALIAS=emunds" >> "$GITHUB_ENV"
            echo "EMUNDS_KEY_PASSWORD=emunds123" >> "$GITHUB_ENV"
          fi
          echo "EMUNDS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: EmuNDS-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk

  linux:
    # Desktop build for cross-play: melonDS Qt frontend from the same pinned core as the APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ pkg-config \
            qt6-base-dev qt6-base-private-dev qt6-multimedia-dev libqt6svg6-dev libqt6opengl6-dev \
            libsdl2-dev libarchive-dev libzstd-dev libfaad-dev libenet-dev extra-cmake-modules \
            libwayland-dev libasound2-dev libegl-dev libgl-dev

      - name: Build
        run: ./scripts/build_linux.sh

      - name: Package
        run: tar -C build-linux -czf EmuNDS-linux-x86_64.tar.gz EmuNDS-linux

      - uses: actions/upload-artifact@v4
        with:
          name: EmuNDS-linux
          path: EmuNDS-linux-x86_64.tar.gz

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: EmuNDS-linux-x86_64.tar.gz
